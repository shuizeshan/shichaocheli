/* ---------- 输入 ---------- */
function initInput() {
  document.addEventListener('keydown', function (e) {
    var k = (e.key || '').toLowerCase();
    keys[k] = true;
    if (k === ' ' || k.indexOf('arrow') === 0) { if (e.preventDefault) e.preventDefault(); }
    if (e.repeat) return;
    if (G.screen === 'lootResult') {
      if (k === 'e' || k === ' ' || k === 'enter' || k === 'escape' || k === 'f') {
        if (e.preventDefault) e.preventDefault();
        confirmLoot();
      }
      return;
    }
    if (G.screen === 'raid' && G.raid) {
      if (k === 'r') startReload();
      if (k === 'q') switchWeapon();
      if (k === '1') useItem('bandage');
      if (k === '2') useItem('medkit');
      if (k === '3') useItem('food');
      if (k === '4') useItem('water');
      if (k === 'b' || k === 'tab') { if (e.preventDefault) e.preventDefault(); openBag(); return; }
      if (k === 'escape') { showScreen('pause'); }
    } else if (G.screen === 'pause' && k === 'escape') {
      showScreen('raid');
    } else if (G.screen === 'bag' && (k === 'b' || k === 'tab' || k === 'escape')) {
      if (e.preventDefault) e.preventDefault();
      closeBag();
    }
  });
  document.addEventListener('keyup', function (e) {
    keys[(e.key || '').toLowerCase()] = false;
  });
  if (cv) {
    cv.addEventListener('mousemove', function (e) {
      var r = cv.getBoundingClientRect ? cv.getBoundingClientRect() : { left: 0, top: 0 };
      mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top;
    });
    cv.addEventListener('mousedown', function (e) { if (e.button === 0) mouse.down = true; });
    cv.addEventListener('mouseup', function (e) { if (e.button === 0) mouse.down = false; });
    cv.addEventListener('contextmenu', function (e) { if (e.preventDefault) e.preventDefault(); });
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('mouseup', function () { mouse.down = false; });
    window.addEventListener('blur', function () { mouse.down = false; for (var k in keys) keys[k] = false; });
  }
}

/* ---------- 主循环 ---------- */
var lastTs = 0;
function step(dt) {
  G.tick++;
  if (G.screen === 'raid' && G.raid) {
    if (G.raid.phase === 'done' || G.raid.phase === 'dead') {
      render(); updateHud(dt);
      renderScreen();
      if (hudEl) hudEl.classList.add('hide');
      return;
    }
    updateRaid(dt);
    render();
    updateHud(dt);
  }
}
function loop(ts) {
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  var dt = lastTs ? Math.min(0.05, (ts - lastTs) / 1000) : 0.016;
  lastTs = ts;
  step(dt);
}

function boot() {
  initCanvas();
  initUI();
  initInput();
  curSlot = getCurSlot();
  if (!G.base) { if (!load()) { G.base = newBase(); G.base.slot = curSlot; } }
  try { applySettings(); } catch (e) {}
  try { initMenuFx(); } catch (e) {}
  showScreen('menu');
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
}

/* =========================================================
   主菜单电影感背景：低开销 2D 剪影微动画
   图层顺序：夜空 → 硝烟 → 远景/中景城市剪影 → 火光 → 逃难人群 / 追击怪物 / 抵抗警察 → 火星 → 暗角
   实现要点：
   - 静态层（天空渐变 / 楼群 / 地面）预渲染到离屏 canvas，逐帧只做一次 blit；
   - 动态元素仅 7 人群 + 5 怪物 + 3 警察 + 34 火星 + 4 硝烟 + 4 火光，刷新锁定 30fps；
   - 逻辑与绘制分离：update()/paint() 可单独调用，无 DOM 场景（自动化测试）也能跑逻辑；
   - 离开主菜单立即停表，不占用进入游戏后的帧预算。
   ========================================================= */
var MENUBG = (function () {
  var DW = 960, DH = 540;
  var cv = null, c2 = null, bgLayer = null;
  var cw = 0, ch = 0, boundResize = false;
  var t = 0, rafId = 0, running = false, inited = false;
  var lastTs = 0, acc = 0, paintCount = 0, updCount = 0;
  var embers = [], crowd = [], zoms = [], cops = [], smokes = [], fires = [], flick = [];
  var lineA = [], lineB = [], flashes = 0;
  var car = null, columns = [], beam = null, sirenMix = 0;

  function rand(a, b) { return a + Math.random() * (b - a); }

  /* ---------- 城市剪影数据 ---------- */
  function buildSkyline(minW, maxW, hMax, baseH, lit) {
    var out = [], x = -24;
    while (x < DW + 24) {
      var w = rand(minW, maxW);
      var h = rand(hMax * 0.42, hMax);
      var wins = [];
      var cols = Math.floor(w / 9), rows = Math.floor(h / 13);
      for (var cx = 0; cx < cols; cx++) {
        for (var ry = 0; ry < rows; ry++) {
          if (Math.random() < 0.17) {
            var wx = 5 + cx * 9, wy = 8 + ry * 13;
            wins.push({ x: wx, y: wy, w: 3.2, h: 4.6 });
            if (lit && Math.random() < 0.12) {
              flick.push({ x: x + wx, y: baseH - h + wy, ph: rand(0, 6.28), sp: rand(0.5, 1.7) });
            }
          }
        }
      }
      out.push({ x: x, w: w, h: h, wins: wins, ant: Math.random() < 0.2 });
      x += w + rand(2, 8);
    }
    return out;
  }

  function initData() {
    if (inited) return;
    inited = true;
    flick.length = 0;

    embers.length = 0;
    for (var i = 0; i < 34; i++) {
      embers.push({ x: rand(0, DW), y: rand(0, DH), vx: rand(-16, 16), vy: rand(-28, -9), r: rand(0.7, 2.0), a: rand(0.22, 0.8), ph: rand(0, 6.28) });
    }

    /* 逃难人群：从右向左跑；怪物在人群右侧（后方）追击，警察在左侧抵抗 */
    crowd.length = 0;
    for (var j = 0; j < 7; j++) {
      crowd.push({ x: rand(DW * 0.34, DW * 0.58), spd: rand(36, 62), ph: rand(0, 6.28), s: rand(0.92, 1.12), frac: rand(0, 1), panic: rand(0, 1) });
    }
    zoms.length = 0;
    var kindSeq = ['walker', 'walker', 'brute', 'walker', 'dog'];
    for (var k = 0; k < 5; k++) {
      zoms.push({ x: rand(DW * 0.70, DW * 1.02), spd: rand(24, 42), ph: rand(0, 6.28), s: rand(0.96, 1.18), frac: rand(0, 1), kind: kindSeq[k] });
    }
    /* 防线整体放在画面右侧 6 成区域：左侧留给标题卡，主体剧情不被遮挡 */
    cops.length = 0;
    for (var m = 0; m < 3; m++) {
      cops.push({ x: DW * 0.585 + m * 38 + rand(-8, 8), ph: rand(0, 6.28), s: rand(0.95, 1.1), frac: rand(0.05, 0.28), fireT: 0, next: rand(0.4, 1.8) });
    }
    /* 前排两名特警举防暴盾，轮廓更易辨识 */
    cops[0].shield = true;
    cops[2].shield = true;

    /* 警车：停在防线后方偏左，车顶爆闪红蓝警灯 */
    car = { x: DW * 0.47, y: DH * 0.80, s: 1.45, lit: 0, ph: rand(0, 6.28) };

    /* 火场烟柱：从火点底部升起的柱状烟，比纯雾团更易辨识 */
    columns.length = 0;
    for (var ci2 = 0; ci2 < 3; ci2++) {
      var puffs = [];
      for (var pj = 0; pj < 5; pj++) puffs.push({ o: pj / 5 + rand(-0.04, 0.04) });
      columns.push({
        x: DW * (0.22 + ci2 * 0.27) + rand(-22, 22),
        y: DH * (0.68 + rand(-0.02, 0.03)),
        h: DH * rand(0.36, 0.50), r: rand(15, 23),
        spd: rand(0.045, 0.075), a: rand(0.24, 0.34), puffs: puffs
      });
    }

    /* 探照灯：高空缓慢扫过楼群 */
    beam = { x: DW * 0.66, y: DH * 0.09, ang: 1.18, sw: 0.42, spd: 0.26 };
    smokes.length = 0;
    for (var n = 0; n < 4; n++) {
      smokes.push({ x: rand(DW * 0.08, DW * 0.95), y: rand(DH * 0.16, DH * 0.46), r: rand(90, 190), a: rand(0.08, 0.16), vx: rand(5, 13), ph: rand(0, 6.28) });
    }
    fires.length = 0;
    for (var f = 0; f < 4; f++) {
      fires.push({ x: DW * (0.16 + f * 0.24) + rand(-26, 26), y: DH * (0.655 + rand(-0.04, 0.05)), r: rand(96, 168), ph: rand(0, 6.28) });
    }

    lineA = buildSkyline(26, 44, 118, DH * 0.735, true);
    lineB = buildSkyline(18, 34, 92, DH * 0.86, false);
  }

  /* ---------- 逻辑推进（无 DOM 依赖） ---------- */
  function update(dt) {
    if (!inited) initData();
    dt = Math.max(0, Math.min(0.06, dt || 0));
    t += dt;
    updCount++;

    var i, e;
    for (i = 0; i < embers.length; i++) {
      e = embers[i];
      e.x += (e.vx + Math.sin(t * 1.4 + e.ph) * 10) * dt;
      e.y += e.vy * dt;
      if (e.y < -10) { e.y = DH + 10; e.x = rand(0, DW); }
      if (e.x < -10) e.x = DW + 10; else if (e.x > DW + 10) e.x = -10;
    }

    var c;
    for (i = 0; i < crowd.length; i++) {
      c = crowd[i];
      c.x -= c.spd * dt;
      c.ph += dt * (7.2 + c.panic * 2.4);
      if (c.x < -46) { c.x = DW * rand(0.60, 0.98); c.frac = rand(0, 1); c.spd = rand(36, 62); }
    }
    var z;
    for (i = 0; i < zoms.length; i++) {
      z = zoms[i];
      z.x -= z.spd * dt;
      z.ph += dt * (4.4 + (z.kind === 'dog' ? 3.4 : 0.8));
      if (z.x < -60) { z.x = DW * rand(0.78, 1.12); z.frac = rand(0, 1); z.spd = rand(24, 42); }
    }
    var cp;
    for (i = 0; i < cops.length; i++) {
      cp = cops[i];
      cp.ph += dt * 1.7;
      cp.next -= dt;
      if (cp.fireT > 0) cp.fireT = Math.max(0, cp.fireT - dt);
      if (cp.next <= 0) { cp.next = rand(0.75, 2.1); cp.fireT = 0.10; flashes++; }
    }
    if (car) {
      car.lit += dt;
      /* 红蓝交替：0=红 1=蓝，各占半周期 */
      car.ph = (car.lit % 1.05) / 1.05;
    }
    if (beam) {
      beam.ang = 1.16 + Math.sin(t * beam.spd) * beam.sw;
    }
    sirenMix = 0.5 + 0.5 * Math.sin(t * 5.6);
    var s;
    for (i = 0; i < smokes.length; i++) {
      s = smokes[i];
      s.x += s.vx * dt;
      if (s.x - s.r > DW + 60) s.x = -s.r - 40;
    }
  }

  /* ---------- 绘制 ---------- */
  function figY(f) { return DH * 0.695 + f.frac * DH * 0.145; }
  function figS(f) { return (0.82 + f.frac * 0.55) * 1.32; }

  function limb(c, x1, y1, x2, y2, w) {
    c.lineWidth = w;
    c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke();
  }

  function shadow(c, x, y, s, rx) {
    c.fillStyle = 'rgba(0,0,0,0.42)';
    c.beginPath(); c.ellipse(x, y + 2, rx * s, 2.6 * s, 0, 0, 6.2832); c.fill();
  }

  /* 逃难者：俯身前倾奔跑，双臂护头（恐慌） */
  function drawRunner(c, f) {
    var x = f.x, y = figY(f), s = figS(f) * f.s;
    var ph = f.ph, swing = Math.sin(ph);
    shadow(c, x, y, s, 7);
    var hipY = y - 19 * s, neckY = y - 33 * s;
    c.strokeStyle = '#04060a'; c.fillStyle = '#04060a'; c.lineCap = 'round';
    limb(c, x, hipY, x + 2.4 * s, neckY + 3 * s, 6.4 * s);
    c.beginPath(); c.arc(x + 3.4 * s, neckY, 4.3 * s, 0, 6.2832); c.fill();
    limb(c, x, hipY, x + swing * 9.5 * s, y - 1, 3.3 * s);
    limb(c, x, hipY, x - swing * 9.5 * s, y - 1, 3.3 * s);
    /* 双臂举起护头 */
    limb(c, x + 1.6 * s, neckY + 7 * s, x + 8.5 * s, neckY - 1.5 * s, 2.7 * s);
    limb(c, x + 0.6 * s, neckY + 8 * s, x + 7.2 * s, neckY + 1.5 * s, 2.7 * s);
    /* 背后火光的暖轮廓 */
    c.strokeStyle = 'rgba(238,146,68,0.46)';
    limb(c, x + 1.2 * s, neckY + 4 * s, x, hipY, 1.1 * s);
  }

  /* 怪物：前扑、手臂前伸 */
  function drawMonster(c, z) {
    var x = z.x, y = figY(z), s = figS(z) * z.s;
    var ph = z.ph, swing = Math.sin(ph);
    shadow(c, x, y, s, 8);
    c.strokeStyle = '#04060a'; c.fillStyle = '#04060a'; c.lineCap = 'round';
    if (z.kind === 'dog') {
      c.beginPath(); c.ellipse(x, y - 10 * s, 12 * s, 5.4 * s, 0, 0, 6.2832); c.fill();
      c.beginPath(); c.arc(x - 12 * s, y - 13 * s, 4.6 * s, 0, 6.2832); c.fill();
      limb(c, x - 6 * s, y - 6 * s, x - 9 * s + swing * 4 * s, y, 2.2 * s);
      limb(c, x + 5 * s, y - 6 * s, x + 7 * s - swing * 4 * s, y, 2.2 * s);
      limb(c, x + 11 * s, y - 12 * s, x + 19 * s, y - 18 * s, 1.8 * s);
      /* 一对红眼：低光下也能一眼认出这是怪物 */
      c.fillStyle = 'rgba(255,84,56,0.85)';
      c.beginPath(); c.arc(x - 16.2 * s, y - 14.2 * s, 1.7 * s, 0, 6.2832); c.fill();
      c.beginPath(); c.arc(x - 15.4 * s, y - 11.6 * s, 1.7 * s, 0, 6.2832); c.fill();
      return;
    }
    var big = z.kind === 'brute' ? 1.34 : 1;
    var hipY = y - 18 * s * big, neckY = y - 30 * s * big;
    c.strokeStyle = '#04060a'; c.fillStyle = '#04060a';
    limb(c, x, hipY, x - 3 * s, neckY + 3 * s, (big > 1 ? 9.6 : 6.8) * s);
    c.beginPath(); c.arc(x - 5 * s, neckY, (big > 1 ? 5.2 : 4.4) * s, 0, 6.2832); c.fill();
    limb(c, x, hipY, x - swing * 9 * s, y - 1, 3.4 * s * big);
    limb(c, x, hipY, x + swing * 9 * s, y - 1, 3.4 * s * big);
    /* 前伸双臂（伸向逃跑的人群方向） */
    limb(c, x - 1 * s, neckY + 6 * s, x - 17 * s, neckY + 3 * s + swing * 2 * s, 2.8 * s * big);
    limb(c, x - 1 * s, neckY + 7 * s, x - 16 * s, neckY + 11 * s - swing * 2 * s, 2.8 * s * big);
    c.strokeStyle = 'rgba(236,132,66,0.46)';
    limb(c, x - 1 * s, neckY + 4 * s, x, hipY, 1.1 * s);
    /* 一对红眼 */
    c.fillStyle = 'rgba(255,84,56,0.9)';
    c.beginPath(); c.arc(x - 7.4 * s, neckY - 1.2 * s, 1.85 * s, 0, 6.2832); c.fill();
    c.beginPath(); c.arc(x - 7.4 * s, neckY + 1.7 * s, 1.85 * s, 0, 6.2832); c.fill();
  }

  /* 警察/特警：低姿持枪，枪口方向朝右（面向怪物），开火时枪口闪光 + 曳光 */
  function drawCop(c, cp, target) {
    var x = cp.x, y = figY(cp), s = figS(cp) * cp.s;
    var bob = Math.sin(cp.ph) * 0.8;
    shadow(c, x, y, s, 8);
    var hipY = y - 18 * s, neckY = y - 32 * s + bob;
    c.strokeStyle = '#04060a'; c.fillStyle = '#04060a'; c.lineCap = 'round';
    /* 防弹背心更厚 */
    limb(c, x, hipY, x + 1 * s, neckY + 3 * s, 8.4 * s);
    /* 头盔 */
    c.beginPath(); c.arc(x + 1.6 * s, neckY, 4.9 * s, 0, 6.2832); c.fill();
    c.fillRect(x + 4.4 * s, neckY - 1.4 * s, 3.6 * s, 1.8 * s);
    /* 双腿微屈站姿 */
    limb(c, x, hipY, x - 5 * s, y - 1, 3.6 * s);
    limb(c, x, hipY, x + 5 * s, y - 1, 3.6 * s);
    /* 持枪手臂 + 步枪 */
    limb(c, x + 1 * s, neckY + 8 * s, x + 12 * s, neckY + 6 * s, 2.9 * s);
    c.fillStyle = '#04060a';
    c.fillRect(x + 9 * s, neckY + 4.2 * s, 15 * s, 2.4 * s);
    c.fillRect(x + 11 * s, neckY + 6.2 * s, 3 * s, 3.4 * s);
    /* 火光暖边（左）＋ 警灯冷调轮廓（右），让人物从暗背景里浮出来 */
    c.strokeStyle = 'rgba(242,158,78,0.48)';
    limb(c, x + 1 * s, neckY + 5 * s, x, hipY, 1.2 * s);
    c.strokeStyle = 'rgba(150,206,246,0.26)';
    limb(c, x + 2 * s, neckY + 4 * s, x + 5 * s, hipY - 1 * s, 1.0 * s);
    /* 头盔冷光高光 */
    c.strokeStyle = 'rgba(168,216,250,0.32)';
    c.lineWidth = 1.0;
    c.beginPath(); c.arc(x + 1.6 * s, neckY, 4.9 * s, -1.15, 0.55); c.stroke();
    /* 防暴盾：前排特警举盾，轮廓一眼可辨 */
    if (cp.shield) {
      var sy0 = neckY - 4 * s, sy1 = hipY + 10 * s;
      c.fillStyle = '#080b11';
      c.beginPath();
      if (c.roundRect) c.roundRect(x + 9.5 * s, sy0, 9 * s, sy1 - sy0, 2.4 * s);
      else c.rect(x + 9.5 * s, sy0, 9 * s, sy1 - sy0);
      c.fill();
      c.strokeStyle = 'rgba(158,208,244,0.30)';
      c.lineWidth = 1.05;
      c.beginPath();
      c.moveTo(x + 10.4 * s, sy0 + 2 * s);
      c.lineTo(x + 10.4 * s, sy1 - 2 * s);
      c.stroke();
      c.strokeStyle = 'rgba(120,170,210,0.16)';
      c.lineWidth = 0.9;
      c.beginPath();
      c.moveTo(x + 9.5 * s, sy0 + (sy1 - sy0) * 0.52);
      c.lineTo(x + 18.5 * s, sy0 + (sy1 - sy0) * 0.52);
      c.stroke();
    }
    if (cp.fireT > 0) {
      var mx = x + 25 * s, my = neckY + 5.4 * s;
      c.fillStyle = 'rgba(255,226,150,0.9)';
      c.beginPath(); c.arc(mx, my, 3.2 * s, 0, 6.2832); c.fill();
      c.fillStyle = 'rgba(255,190,90,0.55)';
      c.beginPath();
      c.moveTo(mx, my - 2.4 * s); c.lineTo(mx + 9 * s, my); c.lineTo(mx, my + 2.4 * s);
      c.closePath(); c.fill();
      if (target) {
        c.strokeStyle = 'rgba(255,232,170,0.45)';
        c.lineWidth = 1.1;
        c.beginPath(); c.moveTo(mx, my); c.lineTo(target.x - 4, figY(target) - 20); c.stroke();
      }
    }
  }

  /* 警车剪影：车顶红蓝爆闪 + 车身轮廓 */
  function drawCar(c) {
    var x = car.x, y = car.y, s = car.s;
    c.fillStyle = '#04060a';
    c.beginPath();
    c.moveTo(x - 44 * s, y);
    c.lineTo(x - 42 * s, y - 10 * s);
    c.lineTo(x - 16 * s, y - 12 * s);
    c.lineTo(x - 7 * s, y - 21 * s);
    c.lineTo(x + 21 * s, y - 21 * s);
    c.lineTo(x + 31 * s, y - 12 * s);
    c.lineTo(x + 46 * s, y - 10 * s);
    c.lineTo(x + 48 * s, y);
    c.closePath(); c.fill();
    c.beginPath(); c.arc(x - 25 * s, y + 1, 6.6 * s, 0, 6.2832); c.fill();
    c.beginPath(); c.arc(x + 29 * s, y + 1, 6.6 * s, 0, 6.2832); c.fill();
    /* 轮廓光：车顶与车头一点暖边，避免整车糊死在暗部 */
    c.strokeStyle = 'rgba(236,152,82,0.26)';
    c.lineWidth = 1.1;
    c.beginPath();
    c.moveTo(x - 42 * s, y - 10 * s);
    c.lineTo(x - 16 * s, y - 12 * s);
    c.lineTo(x - 7 * s, y - 21 * s);
    c.lineTo(x + 21 * s, y - 21 * s);
    c.lineTo(x + 31 * s, y - 12 * s);
    c.lineTo(x + 46 * s, y - 10 * s);
    c.stroke();
    /* 车顶警灯：红蓝交替发光 */
    var ph = car.ph || 0;
    var redOn = ph < 0.5;
    var lx = x + 2 * s, ly = y - 23 * s;
    c.fillStyle = redOn ? 'rgba(255,74,58,0.95)' : 'rgba(120,44,40,0.55)';
    c.fillRect(lx - 8 * s, ly, 7 * s, 3.4 * s);
    c.fillStyle = redOn ? 'rgba(110,60,150,0.45)' : 'rgba(120,186,255,0.95)';
    c.fillRect(lx + 1 * s, ly, 7 * s, 3.4 * s);
    /* 灯条外溢光 */
    var gc = redOn ? '255,70,54' : '96,168,255';
    var gr = c.createRadialGradient(lx, ly + 1.6 * s, 0, lx, ly + 1.6 * s, 34 * s);
    gr.addColorStop(0, 'rgba(' + gc + ',0.34)');
    gr.addColorStop(1, 'rgba(' + gc + ',0)');
    c.fillStyle = gr;
    c.beginPath(); c.arc(lx, ly + 1.6 * s, 34 * s, 0, 6.2832); c.fill();
  }

  function paint() {
    if (!c2 || !cw || !ch) return;
    var c = c2;
    if (c.setTransform) c.setTransform(1, 0, 0, 1, 0, 0);
    c.clearRect(0, 0, cw, ch);
    if (bgLayer) c.drawImage(bgLayer, 0, 0, cw, ch);
    c.save();
    c.scale(cw / DW, ch / DH);

    /* 硝烟（叠加发光） */
    c.globalCompositeOperation = 'lighter';
    for (var i = 0; i < smokes.length; i++) {
      var s = smokes[i];
      var sg = c.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r);
      sg.addColorStop(0, 'rgba(146,114,84,' + (s.a * 1.35).toFixed(3) + ')');
      sg.addColorStop(1, 'rgba(56,42,30,0)');
      c.fillStyle = sg;
      c.beginPath(); c.arc(s.x, s.y, s.r, 0, 6.2832); c.fill();
    }
    /* 火光：脉动的暖色光斑，压在城市剪影底部 */
    for (var fi = 0; fi < fires.length; fi++) {
      var f = fires[fi];
      var puls = 0.66 + 0.34 * Math.sin(t * 4.7 + f.ph) * Math.sin(t * 2.1 + f.ph * 1.7);
      var rr = f.r * (1.02 + 0.16 * puls);
      var fg = c.createRadialGradient(f.x, f.y, 0, f.x, f.y, rr);
      fg.addColorStop(0, 'rgba(255,222,152,' + (0.92 * puls).toFixed(3) + ')');
      fg.addColorStop(0.32, 'rgba(255,156,64,' + (0.58 * puls).toFixed(3) + ')');
      fg.addColorStop(0.68, 'rgba(198,80,26,' + (0.26 * puls).toFixed(3) + ')');
      fg.addColorStop(1, 'rgba(120,40,10,0)');
      c.fillStyle = fg;
      c.beginPath(); c.arc(f.x, f.y, rr, 0, 6.2832); c.fill();
    }
    /* 地面火光反照：在人物脚下铺一条暖色亮带，让纯黑剪影有背光可读 */
    var groundGlow = c.createLinearGradient(0, DH * 0.64, 0, DH * 0.92);
    groundGlow.addColorStop(0, 'rgba(255,150,70,0.13)');
    groundGlow.addColorStop(0.42, 'rgba(236,116,44,0.075)');
    groundGlow.addColorStop(1, 'rgba(150,62,24,0)');
    c.fillStyle = groundGlow;
    c.fillRect(0, DH * 0.66, DW, DH * 0.24);
    /* 火场烟柱：柱状上浮扩散，比雾团更像燃烧后的黑烟 */
    for (var ci = 0; ci < columns.length; ci++) {
      var col = columns[ci];
      for (var cj = 0; cj < col.puffs.length; cj++) {
        var pf = col.puffs[cj];
        var a2 = (t * col.spd + pf.o) % 1;
        var py = col.y - a2 * col.h;
        var pr2 = col.r * (0.45 + a2 * 1.5);
        var px2 = col.x + Math.sin(t * 0.7 + pf.o * 6.2832) * (5 + a2 * 24) - a2 * 16;
        var al2 = col.a * 1.35 * Math.sin(a2 * Math.PI) * (1 - a2 * 0.28);
        if (al2 <= 0.002) continue;
        var cg = c.createRadialGradient(px2, py, 0, px2, py, pr2);
        cg.addColorStop(0, 'rgba(172,146,118,' + al2.toFixed(3) + ')');
        cg.addColorStop(0.55, 'rgba(120,100,82,' + (al2 * 0.6).toFixed(3) + ')');
        cg.addColorStop(1, 'rgba(70,58,48,0)');
        c.fillStyle = cg;
        c.beginPath(); c.arc(px2, py, pr2, 0, 6.2832); c.fill();
      }
    }
    /* 警灯泛光：照亮防线一带的地面与警察轮廓 */
    if (car) {
      var ph2 = car.ph || 0;
      var isRed = ph2 < 0.5;
      var pulse = 0.55 + 0.45 * Math.abs(Math.sin(t * 8.4));
      var base = isRed ? '255,70,54' : '92,166,255';
      var gx = car.x + 10, gy = DH * 0.775 - 26;
      var sgr = c.createRadialGradient(gx, gy, 0, gx, gy, 190);
      sgr.addColorStop(0, 'rgba(' + base + ',' + (0.20 * pulse).toFixed(3) + ')');
      sgr.addColorStop(0.5, 'rgba(' + base + ',' + (0.07 * pulse).toFixed(3) + ')');
      sgr.addColorStop(1, 'rgba(' + base + ',0)');
      c.fillStyle = sgr;
      c.beginPath(); c.arc(gx, gy, 190, 0, 6.2832); c.fill();
      /* 反向色补光，形成红蓝交替的层次 */
      var base2 = isRed ? '92,166,255' : '255,70,54';
      var gx2 = gx + 46;
      var sgr2 = c.createRadialGradient(gx2, gy + 8, 0, gx2, gy + 8, 120);
      sgr2.addColorStop(0, 'rgba(' + base2 + ',' + (0.10 * (1 - pulse)).toFixed(3) + ')');
      sgr2.addColorStop(1, 'rgba(' + base2 + ',0)');
      c.fillStyle = sgr2;
      c.beginPath(); c.arc(gx2, gy + 8, 120, 0, 6.2832); c.fill();
    }
    /* 高空探照灯：缓慢扫过楼群的锥形光柱 */
    if (beam) {
      var bl = 300;
      var ex = beam.x + Math.cos(beam.ang) * bl;
      var ey = beam.y + Math.sin(beam.ang) * bl;
      var bgr = c.createLinearGradient(beam.x, beam.y, ex, ey);
      bgr.addColorStop(0, 'rgba(208,232,255,0.16)');
      bgr.addColorStop(0.65, 'rgba(182,212,246,0.07)');
      bgr.addColorStop(1, 'rgba(160,190,230,0)');
      c.fillStyle = bgr;
      c.beginPath();
      c.moveTo(beam.x, beam.y);
      c.lineTo(ex - 26, ey + 34);
      c.lineTo(ex + 30, ey - 6);
      c.closePath(); c.fill();
    }
    c.globalCompositeOperation = 'source-over';

    /* 窗内零星灯火（缓慢呼吸，制造“还有人在”的错觉） */
    for (var wi = 0; wi < flick.length; wi++) {
      var fw = flick[wi];
      var la = 0.20 + 0.24 * (0.5 + 0.5 * Math.sin(t * fw.sp + fw.ph));
      c.fillStyle = 'rgba(255,176,96,' + Math.min(0.55, la).toFixed(3) + ')';
      c.fillRect(fw.x, fw.y, 2.6, 3.6);
    }

    /* 地面雾带，压住人物脚下 */
    var gz = c.createLinearGradient(0, DH * 0.72, 0, DH);
    gz.addColorStop(0, 'rgba(10,13,16,0)');
    gz.addColorStop(0.42, 'rgba(20,20,21,0.16)');
    gz.addColorStop(1, 'rgba(10,10,11,0.38)');
    c.fillStyle = gz;
    c.fillRect(0, DH * 0.72, DW, DH * 0.28);

    /* 人物三层：人群（远）→ 怪物（中）→ 警察（近）
       统一叠一层火场暖色逆光（shadowBlur），让纯黑剪影在暗背景上也能读出轮廓 */
    var i2;
    c.save();
    c.shadowColor = 'rgba(255,164,84,0.62)';
    c.shadowBlur = 9;
    for (i2 = 0; i2 < crowd.length; i2++) drawRunner(c, crowd[i2]);
    for (i2 = 0; i2 < zoms.length; i2++) drawMonster(c, zoms[i2]);
    for (i2 = 0; i2 < cops.length; i2++) drawCop(c, cops[i2], zoms[(i2 * 2) % zoms.length]);
    c.restore();
    if (car) drawCar(c);

    /* 火星 */
    for (i2 = 0; i2 < embers.length; i2++) {
      var e = embers[i2];
      var ea = e.a * (0.6 + 0.4 * Math.sin(t * 3 + e.ph));
      c.fillStyle = 'rgba(255,186,104,' + Math.max(0, ea).toFixed(3) + ')';
      c.beginPath(); c.arc(e.x, e.y, e.r, 0, 6.2832); c.fill();
    }

    /* 暗角 + 上下压暗，强化电影感 */
    var vg = c.createRadialGradient(DW * 0.5, DH * 0.52, DH * 0.24, DW * 0.5, DH * 0.52, DH * 0.92);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(0.62, 'rgba(0,0,0,0.13)');
    vg.addColorStop(1, 'rgba(0,0,0,0.48)');
    c.fillStyle = vg;
    c.fillRect(0, 0, DW, DH);
    c.restore();
  }

  /* ---------- 静态层：天空 / 楼群 / 地面，一次性画进离屏 canvas ---------- */
  function drawSkylineTo(g, line, baseH, color, lit) {
    for (var i = 0; i < line.length; i++) {
      var b = line[i];
      g.fillStyle = color;
      g.fillRect(b.x, baseH - b.h, b.w, b.h);
      if (b.ant) g.fillRect(b.x + b.w * 0.5 - 0.8, baseH - b.h - 10, 1.7, 10);
      if (lit) {
        for (var w = 0; w < b.wins.length; w++) {
          var win = b.wins[w];
          g.fillStyle = 'rgba(255,182,104,' + (0.10 + (w % 4) * 0.055).toFixed(3) + ')';
          g.fillRect(b.x + win.x, baseH - b.h + win.y, win.w, win.h);
        }
      }
    }
  }

  function buildStatic() {
    bgLayer = null;
    if (!c2 || !cw || !ch) return;
    var lcv = null;
    try { lcv = document.createElement('canvas'); } catch (e) { lcv = null; }
    if (!lcv || !lcv.getContext) return;
    lcv.width = cw; lcv.height = ch;
    var g = lcv.getContext('2d');
    if (!g) return;
    try {
    g.save();
    if (g.scale) g.scale(cw / DW, ch / DH);

    var sky = g.createLinearGradient(0, 0, 0, DH * 0.8);
    sky.addColorStop(0, '#121c2e');
    sky.addColorStop(0.40, '#22364b');
    sky.addColorStop(0.64, '#4b5b6c');
    sky.addColorStop(0.86, '#7f5a3c');
    sky.addColorStop(1, '#a06a3d');
    g.fillStyle = sky;
    g.fillRect(0, 0, DW, DH);

    /* 地平线暖雾：把剪影"托"起来 */
    var hz = g.createLinearGradient(0, DH * 0.44, 0, DH * 0.78);
    hz.addColorStop(0, 'rgba(158,92,42,0)');
    hz.addColorStop(0.45, 'rgba(166,94,42,0.40)');
    hz.addColorStop(0.72, 'rgba(142,78,34,0.56)');
    hz.addColorStop(1, 'rgba(114,62,28,0.68)');
    g.fillStyle = hz;
    g.fillRect(0, DH * 0.44, DW, DH * 0.36);

    drawSkylineTo(g, lineA, DH * 0.735, '#080d13', true);
    drawSkylineTo(g, lineB, DH * 0.86, '#04070a', false);

    var gr = g.createLinearGradient(0, DH * 0.72, 0, DH);
    gr.addColorStop(0, 'rgba(38,32,26,0.30)');
    gr.addColorStop(0.5, 'rgba(26,22,19,0.52)');
    gr.addColorStop(1, 'rgba(15,14,14,0.80)');
    g.fillStyle = gr;
    g.fillRect(0, DH * 0.72, DW, DH * 0.28);
    g.restore();
    bgLayer = lcv;
    } catch (e) { bgLayer = null; }
  }

  function resize() {
    if (!cv) return false;
    var rect = null;
    try { rect = cv.getBoundingClientRect ? cv.getBoundingClientRect() : null; } catch (e) { rect = null; }
    var w = cv.clientWidth || (rect && rect.width) || DW;
    var h = cv.clientHeight || (rect && rect.height) || DH;
    w = Math.max(320, Math.min(1920, w));
    h = Math.max(200, Math.min(1080, h));
    /* 降采样到 62%：剪影动画不需要全分辨率，省 GPU/CPU */
    cw = Math.max(240, Math.round(w * 0.62));
    ch = Math.max(140, Math.round(h * 0.62));
    cv.width = cw; cv.height = ch;
    c2 = cv.getContext ? cv.getContext('2d') : null;
    if (!c2) return false;
    buildStatic();
    return true;
  }

  function bindCanvas() {
    if (cv || typeof document === 'undefined') return !!cv;
    cv = document.getElementById ? document.getElementById('menuBgCanvas') : null;
    if (cv && !boundResize) {
      boundResize = true;
      try {
        if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', function () { resize(); });
      } catch (e) {}
    }
    if (cv) resize();
    return !!cv;
  }

  function start() {
    if (!inited) initData();
    running = true;
    if (!bindCanvas()) return false;   /* 无 DOM：只跑逻辑，便于自动化断言 */
    if (rafId) return true;
    if (typeof requestAnimationFrame !== 'function') return false;
    lastTs = 0; acc = 0;
    var tick = function (ts) {
      if (!running) { rafId = 0; return; }
      if (!lastTs) lastTs = ts;
      var dt = Math.min(0.06, Math.max(0, (ts - lastTs) / 1000));
      lastTs = ts;
      acc += dt;
      update(dt);
      if (acc >= 1 / 30) { acc = 0; paint(); paintCount++; }
      rafId = requestAnimationFrame(tick);
    };
    rafId = requestAnimationFrame(tick);
    return true;
  }

  function stop() {
    running = false;
    if (rafId) { try { if (typeof cancelAnimationFrame === 'function') cancelAnimationFrame(rafId); } catch (e) {} rafId = 0; }
  }

  function state() {
    return {
      running: running, inited: inited, t: t, updates: updCount, paints: paintCount,
      flashes: flashes, crowd: crowd.length, zombies: zoms.length, cops: cops.length,
      embers: embers.length, smokes: smokes.length, fires: fires.length, canvas: !!cv, size: [cw, ch],
      crowdX: crowd.length ? crowd[0].x : null,
      zombieX: zoms.length ? zoms[0].x : null,
      fireT: cops.length ? cops[0].fireT : 0,
      columns: columns.length,
      copsShield: cops.filter(function (v) { return !!v.shield; }).length,
      hasCar: !!car,
      sirenPhase: car ? car.ph : 0,
      hasBeam: !!beam
    };
  }

  return {
    start: start, stop: stop, update: update, paint: paint, resize: resize,
    state: state, initData: initData, isRunning: function () { return running; }
  };
})();

/* ---------- 菜单挂件：背景音乐控件 / 命中标记 / 首次手势解锁音频 ---------- */
var HITMARK = { el: null, timer: 0, count: 0 };
var AUDIO_GESTURE_BOUND = false;
/* 击退统计（供自动化断言核对差异化强度） */
var KNOCK = { count: 0, lastPower: 0, maxPower: 0 };

/* 命中标记：准星处闪一个白色 X（DOM 变换，不参与 canvas 绘制） */
function hitMarkFlash() {
  HITMARK.count++;
  var el = HITMARK.el;
  if (!el && typeof document !== 'undefined' && document.getElementById) el = document.getElementById('hitMark');
  if (!el) return;
  HITMARK.el = el;
  if (el.classList) { el.classList.remove('on'); el.classList.add('on'); }
  if (HITMARK.timer) { try { clearTimeout(HITMARK.timer); } catch (e) {} }
  HITMARK.timer = setTimeout(function () { if (el.classList) el.classList.remove('on'); }, 180);
}

function moveHitMark(x, y) {
  var el = HITMARK.el;
  if (!el && typeof document !== 'undefined' && document.getElementById) el = document.getElementById('hitMark');
  if (!el || !el.style) return;
  HITMARK.el = el;
  el.style.left = x + 'px';
  el.style.top = y + 'px';
}

/* 刷新右下角 BGM 控件显示 */
function refreshBgmCtl() {
  var s = getSettings();
  var show = s.mute ? 0 : s.bgm;
  if (typeof document === 'undefined' || !document.getElementById) return;
  var btn = document.getElementById('bgmBtn');
  if (btn) btn.textContent = s.mute ? '已静音' : '音乐';
  var fill = document.getElementById('bgmFill');
  if (fill && fill.style) fill.style.width = Math.round(show * 100) + '%';
  var pct = document.getElementById('bgmPct');
  if (pct) pct.textContent = Math.round(show * 100) + '%';
}

/* 绝对音量设置：按 0.1 步长逼近目标（复用已校验的 stepSetting 通道） */
function setBgmLevel(target) {
  target = Math.max(0, Math.min(1, target));
  var s = getSettings();
  if (s.mute) stepSetting('mute', 1);
  var cur = getSettings().bgm;
  var steps = Math.round((target - cur) / 0.1);
  for (var i = 0; i < Math.abs(steps); i++) stepSetting('bgm', steps > 0 ? 1 : -1);
  refreshBgmCtl();
}

function toggleBgmMute() {
  stepSetting('mute', 1);
  var s = getSettings();
  if (!s.mute && typeof SFX !== 'undefined' && SFX.bgm) {
    var mode = (G.screen === 'raid' || G.screen === 'bag' || G.screen === 'pause') ? 'raid' : 'menu';
    SFX.bgm(true, mode);
  }
  refreshBgmCtl();
}

/* 浏览器自动播放策略：首次真实手势后才创建/启动音频 */
function bindAudioGesture() {
  if (AUDIO_GESTURE_BOUND) return;
  AUDIO_GESTURE_BOUND = true;
  var unlock = function () {
    if (typeof SFX === 'undefined' || !SFX.unlock) return;
    SFX.unlock();
    var scr = G.screen;
    if (scr === 'menu' || scr === 'hub' || scr === 'raid' || scr === 'bag' || scr === 'pause') {
      var mode = (scr === 'raid' || scr === 'bag' || scr === 'pause') ? 'raid' : 'menu';
      SFX.bgm(true, mode);
    }
    refreshBgmCtl();
  };
  var targets = [];
  if (typeof document !== 'undefined' && document.addEventListener) targets.push(document);
  if (typeof window !== 'undefined' && window.addEventListener) targets.push(window);
  var evs = ['pointerdown', 'mousedown', 'touchstart', 'keydown'];
  for (var ti = 0; ti < targets.length; ti++) {
    for (var ei = 0; ei < evs.length; ei++) {
      try { targets[ti].addEventListener(evs[ei], unlock, { passive: true }); } catch (e) {}
    }
  }
}

/* 菜单/游戏切换时驱动背景动画与 BGM 控件可见性 */
function setMenuBgActive(on) {
  if (typeof document !== 'undefined' && document.getElementById) {
    var wrap = document.getElementById('menuBg');
    if (wrap && wrap.classList) { if (on) wrap.classList.add('on'); else wrap.classList.remove('on'); }
    var ctl = document.getElementById('bgmCtl');
    if (ctl && ctl.classList) { if (on) ctl.classList.add('on'); else ctl.classList.remove('on'); }
    var scr = document.getElementById('screen');
    if (scr && scr.classList) { if (on) scr.classList.add('menu-mode'); else scr.classList.remove('menu-mode'); }
  }
  refreshBgmCtl();
  if (on) MENUBG.start(); else MENUBG.stop();
}

function initMenuFx() {
  bindAudioGesture();
  if (typeof document === 'undefined' || !document.getElementById) return;
  var ctl = document.getElementById('bgmCtl');
  if (ctl && ctl.addEventListener) {
    ctl.addEventListener('click', function (ev) {
      var tgt = ev.target;
      var act = tgt && tgt.getAttribute ? tgt.getAttribute('data-bgm') : null;
      if (!act) return;
      if (act === 'mute') toggleBgmMute();
      else if (act === 'up') { stepSetting('bgm', 1); refreshBgmCtl(); if (typeof SFX !== 'undefined') SFX.click(); }
      else if (act === 'down') { stepSetting('bgm', -1); refreshBgmCtl(); if (typeof SFX !== 'undefined') SFX.click(); }
      if (ev.stopPropagation) ev.stopPropagation();
    });
  }
  var bar = document.getElementById('bgmBar');
  if (bar && bar.addEventListener) {
    bar.addEventListener('click', function (ev) {
      var rect = null;
      try { rect = bar.getBoundingClientRect(); } catch (e) { rect = null; }
      if (rect && rect.width) setBgmLevel((ev.clientX - rect.left) / rect.width);
      if (ev.stopPropagation) ev.stopPropagation();
    });
  }
  var cvEl = document.getElementById('cv');
  if (cvEl && cvEl.addEventListener) {
    cvEl.addEventListener('mousemove', function (ev) { moveHitMark(ev.clientX, ev.clientY); });
  }
  refreshBgmCtl();
}
